spring.application.name=java-judge
server.port=8080

# Limits for one submission (see RunnerProperties)
runner.time-limit-ms=2000
runner.compile-time-limit-ms=10000
runner.memory-mb=128
runner.max-output-bytes=65536
runner.max-test-cases=20
runner.max-concurrent-runs=4

# Upload size limit
spring.servlet.multipart.max-file-size=64KB
spring.servlet.multipart.max-request-size=128KB

# LOCAL = run directly on this machine (development only)
# DOCKER = every compile and test runs in a locked-down container (use this when deployed)
runner.sandbox=LOCAL
runner.docker-image=eclipse-temurin:17-jdk-alpine
runner.work-root=
