name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Pull sandbox image
        run: docker pull eclipse-temurin:17-jdk-alpine
      - name: Test
        run: ./mvnw -B test
